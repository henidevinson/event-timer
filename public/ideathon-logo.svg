<svg viewBox="0 0 1170 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7E22CE" />
      <stop offset="45%" stopColor="#581C87" />
      <stop offset="100%" stopColor="#3B0764" />
    </linearGradient>

    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#9333EA" />
      <stop offset="50%" stopColor="#7E22CE" />
      <stop offset="100%" stopColor="#4C1D95" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="100%" stopColor="#6D28D9" />
    </linearGradient>

    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4C1D95" />
      <stop offset="100%" stopColor="#1E0734" />
    </linearGradient>

    <linearGradient id="goldSwoosh" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#996515" />
      <stop offset="25%" stopColor="#D4AF37" />
      <stop offset="60%" stopColor="#F6E05E" />
      <stop offset="85%" stopColor="#E6B800" />
      <stop offset="100%" stopColor="#B38728" />
    </linearGradient>

    <radialGradient id="bulbGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="35%" stopColor="#FDE68A" />
      <stop offset="70%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#B45309" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FCD34D" />
      <stop offset="50%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>

    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodColor="#8B5CF6" floodOpacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- LETTER I -->
    <g transform="translate(25, 60)">
      <path d="M 45 0 L 0 35 L 0 160 L 45 160 Z" fill="url(#facetLight)" />
      <path d="M 45 0 L 45 160 L 50 160 L 50 0 Z" fill="url(#facetHighlight)" />
    </g>

    <!-- LETTER D -->
    <g transform="translate(100, 60)">
      <path d="M 0 0 L 35 0 L 35 160 L 0 160 Z" fill="url(#facetDark)" />
      <path d="M 35 0 L 80 0 C 130 0 150 35 150 80 C 150 125 130 160 80 160 L 35 160 L 35 125 L 75 125 C 105 125 115 105 115 80 C 115 55 105 35 75 35 L 35 35 Z" fill="url(#facetLight)" />
      <path d="M 0 0 L 35 35 L 35 0 Z" fill="url(#facetHighlight)" />
      <path d="M 0 160 L 35 125 L 35 160 Z" fill="#2E1065" />
    </g>

    <!-- LETTER E -->
    <g transform="translate(275, 60)">
      <path d="M 0 0 L 38 0 L 38 160 L 0 160 Z" fill="url(#facetDark)" />
      <path d="M 38 0 L 115 0 L 98 35 L 38 35 Z" fill="url(#facetHighlight)" />
      <path d="M 38 65 L 105 65 L 90 98 L 38 98 Z" fill="url(#facetLight)" />
      <path d="M 38 125 L 115 125 L 115 160 L 38 160 Z" fill="url(#purpleGrad)" />
      <path d="M 0 0 L 38 35 L 38 0 Z" fill="url(#facetHighlight)" />
    </g>

    <!-- LETTER A -->
    <g transform="translate(405, 30)">
      <path d="M 100 0 L 65 30 L 0 190 L 38 190 L 80 85 L 100 85 Z" fill="url(#facetLight)" />
      <path d="M 100 0 L 100 85 L 120 85 L 162 190 L 200 190 L 135 30 Z" fill="url(#facetDark)" />
      <path d="M 100 65 L 85 110 L 115 110 Z" fill="#120D20" />
      <path d="M 5 155 C 50 145 105 115 170 55 C 190 37 205 18 215 5 C 190 28 155 68 115 95 C 75 122 35 140 5 155 Z" fill="url(#goldSwoosh)" />
      <path d="M 15 152 C 55 143 110 112 170 55 C 145 80 100 115 45 140 Z" fill="#FEF08A" opacity="0.6" />
    </g>

    <!-- LETTER T -->
    <g transform="translate(620, 60)">
      <path d="M 0 0 L 105 0 L 105 38 L 0 38 Z" fill="url(#facetLight)" />
      <path d="M 34 38 L 71 38 L 71 160 L 34 160 Z" fill="url(#facetDark)" />
      <path d="M 0 0 L 105 0 L 90 18 L 15 18 Z" fill="url(#facetHighlight)" />
    </g>

    <!-- LETTER H -->
    <g transform="translate(735, 60)">
      <path d="M 0 0 L 36 0 L 36 160 L 0 160 Z" fill="url(#facetLight)" />
      <path d="M 36 62 L 72 62 L 72 98 L 36 98 Z" fill="url(#facetHighlight)" />
      <path d="M 72 0 L 108 0 L 108 160 L 72 160 Z" fill="url(#facetDark)" />
    </g>

    <!-- LETTER O -->
    <g transform="translate(850, 60)">
      <circle cx="80" cy="80" r="78" fill="url(#purpleGrad)" />
      <path d="M 80 2 A 78 78 0 0 1 158 80 L 126 80 A 46 46 0 0 0 80 34 Z" fill="url(#facetHighlight)" />
      <path d="M 158 80 A 78 78 0 0 1 80 158 L 80 126 A 46 46 0 0 0 126 80 Z" fill="#2E1065" />
      <path d="M 80 158 A 78 78 0 0 1 2 80 L 34 80 A 46 46 0 0 0 80 126 Z" fill="url(#facetDark)" />
      <path d="M 2 80 A 78 78 0 0 1 80 2 L 80 34 A 46 46 0 0 0 34 80 Z" fill="url(#facetLight)" />
      <circle cx="80" cy="80" r="46" fill="#120D20" />
      <circle cx="80" cy="80" r="46" stroke="url(#goldRim)" strokeWidth="4" fill="none" />

      <!-- BULB ICON -->
      <g transform="translate(80, 80)">
        <circle cx="0" cy="-7" r="22" fill="url(#bulbGlow)" />
        <path d="M -16 6 C -18 0 -22 -4 -22 -7 C -22 -19 -12 -29 0 -29 C 12 -29 22 -19 22 -7 C 22 -4 18 0 16 6 C 14 11 11 15 11 18 L -11 18 C -11 15 -14 11 -16 6 Z" fill="url(#bulbGlow)" />
        <path d="M -6 14 L -4 1 L -8 -7 M 6 14 L 4 1 L 8 -7 M -8 -7 C -4 -16 4 -16 8 -7" stroke="#78350F" strokeWidth="2.5" strokeLinecap="round" fill="none" />
        <circle cx="0" cy="-11" r="3.5" fill="#FEF3C7" />
        <rect x="-10" y="20" width="20" height="4" rx="2" fill="url(#goldRim)" />
        <rect x="-8.5" y="26" width="17" height="3.5" rx="1.5" fill="url(#goldRim)" />
        <rect x="-6" y="31.5" width="12" height="3" rx="1.5" fill="url(#goldRim)" />
        <path d="M -3.5 35 L 3.5 35 L 0 38.5 Z" fill="#451A03" />
      </g>
    </g>

    <!-- LETTER N -->
    <g transform="translate(1025, 60)">
      <path d="M 0 0 L 35 0 L 35 160 L 0 160 Z" fill="url(#facetLight)" />
      <path d="M 0 0 L 40 0 L 105 160 L 65 160 Z" fill="url(#facetDark)" />
      <path d="M 70 0 L 105 0 L 105 160 L 70 160 Z" fill="url(#facetHighlight)" />
    </g>
  </g>
</svg>
